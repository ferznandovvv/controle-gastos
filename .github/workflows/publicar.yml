# Publica o app no Firebase sempre que algo entra no branch main.
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (chave JSON de uma conta de serviço).
# O bot (functions) fica de fora até o faturamento do Google estar ativo.
name: Publicar no Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Avisar se falta a chave
        if: env.TEM_CHAVE != 'true'
        run: echo "::warning::Segredo FIREBASE_SERVICE_ACCOUNT não cadastrado; nada foi publicado."

      - uses: actions/checkout@v4
        if: env.TEM_CHAVE == 'true'

      - uses: actions/setup-node@v4
        if: env.TEM_CHAVE == 'true'
        with:
          node-version: 22

      - name: Testes do bot
        if: env.TEM_CHAVE == 'true'
        working-directory: functions
        run: node --test

      - uses: google-github-actions/auth@v2
        if: env.TEM_CHAVE == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar site e regras do banco
        if: env.TEM_CHAVE == 'true'
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project gastos-pessoais-8b555 --non-interactive
