# Publica tudo sempre que algo entra no branch main:
#   app   → Firebase Hosting + regras do Firestore (precisa do segredo FIREBASE_SERVICE_ACCOUNT)
#   bot   → Cloudflare Workers (precisa de CLOUDFLARE_API_TOKEN; as chaves do Atalho e do Telegram vão junto)
# Cada parte só é publicada quando os segredos dela estão cadastrados no GitHub.
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Avisar se falta a chave
        if: env.TEM_CHAVE != 'true'
        run: echo "::warning::Segredo FIREBASE_SERVICE_ACCOUNT não cadastrado; o app não foi publicado."

      - uses: actions/checkout@v4
        if: env.TEM_CHAVE == 'true'

      - uses: google-github-actions/auth@v2
        if: env.TEM_CHAVE == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar site e regras do banco
        if: env.TEM_CHAVE == 'true'
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project gastos-pessoais-8b555 --non-interactive

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    env:
      TEM_CHAVE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      TEM_TELEGRAM: ${{ secrets.TELEGRAM_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes do bot
        run: node --test

      - name: Avisar se falta a chave
        if: env.TEM_CHAVE != 'true'
        run: echo "::warning::Segredo CLOUDFLARE_API_TOKEN não cadastrado; o bot não foi publicado."

      - name: Publicar o bot
        if: env.TEM_CHAVE == 'true'
        run: |
          npx --yes wrangler@4 deploy | tee "$RUNNER_TEMP/deploy.log"
          grep -o 'https://[^ ]*workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 > "$RUNNER_TEMP/url_bot"

      - name: Enviar os segredos do bot
        if: env.TEM_CHAVE == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_USUARIOS_PERMITIDOS: ${{ secrets.TELEGRAM_USUARIOS_PERMITIDOS }}
          ATALHO_CHAVES: ${{ secrets.ATALHO_CHAVES }}
        run: |
          node -e '
            const nomes = ["FIREBASE_SERVICE_ACCOUNT", "ATALHO_CHAVES", "TELEGRAM_TOKEN", "TELEGRAM_USUARIOS_PERMITIDOS"];
            const s = Object.fromEntries(nomes.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            console.log("Enviando:", Object.keys(s).join(", ") || "nenhum");
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/segredos.json", JSON.stringify(s), { mode: 0o600 });
          '
          if [ "$(cat "$RUNNER_TEMP/segredos.json")" != "{}" ]; then npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/segredos.json"; fi
          rm -f "$RUNNER_TEMP/segredos.json"

      # Diz ao Telegram para onde mandar as mensagens. O segredo é o mesmo que o bot calcula
      # (segredoWebhook em bot/src/index.js): sha256 de "webhook:<token>", 48 primeiros caracteres.
      - name: Registrar o bot no Telegram
        if: env.TEM_CHAVE == 'true' && env.TEM_TELEGRAM == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          URL=$(cat "$RUNNER_TEMP/url_bot")
          SEGREDO=$(printf 'webhook:%s' "$TELEGRAM_TOKEN" | sha256sum | cut -c1-48)
          echo "Webhook: $URL"
          curl -sS --fail-with-body "https://api.telegram.org/bot$TELEGRAM_TOKEN/setWebhook" \
            --data-urlencode "url=$URL" --data-urlencode "secret_token=$SEGREDO" \
            --data-urlencode 'allowed_updates=["message"]'
          echo
